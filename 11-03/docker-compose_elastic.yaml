version: '3.7'

services:
  # Elasticsearch Docker Images: https://www.docker.elastic.co/
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    container_name: elasticsearchGeorge
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - cluster.name=es-nodeGeorge-1
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    #volumes:
    #  - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      forELK:
        ipv4_address: 192.168.21.2



networks:
  forELK:
    ipam:
      driver: bridge
      config:
        - subnet: 192.168.21.0/24
