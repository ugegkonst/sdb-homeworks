version: '3.7'

services:
  # Elasticsearch Docker Images: https://www.docker.elastic.co/
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    container_name: elasticsearchGeorge
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - cluster.name=es-nodeGeorge-1
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      forELK:
        ipv4_address: 192.168.21.2
  kibana:
    container_name: kibanaGeorge
    image: kibana:8.16.5
    environment:
      - ELASTICSEARCH_HOSTS=http://192.168.21.2:9200
    ports:
      - 5601:5601
    depends_on: 
      - elasticsearch
    networks:
      forELK:
        ipv4_address: 192.168.21.3


networks:
  forELK:
    ipam:
#     driver: bridge
     config:
        - subnet: 192.168.21.0/24

volumes:
  elasticsearch-data:
    driver: local